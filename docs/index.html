<!doctype html><html><head><meta charset="utf-8"/><title>Webpack App</title><style>#loading-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(15,23,42,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#f8fafc;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;opacity:1;visibility:visible;pointer-events:auto;transition:opacity .4s ease,visibility 0s linear 0s}#loading-overlay.is-hidden{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .4s ease,visibility 0s linear .4s}.spinner{width:48px;height:48px;border:4px solid #334155;border-top-color:#0ea5e9;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}@keyframes spin{to{transform:rotate(360deg)}}.loader-title{font-size:1.125rem;font-weight:600;letter-spacing:.05em;margin:0 0 8px 0}.loader-subtitle{font-size:.75rem;color:#94a3b8;margin:0}</style><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div id="loading-overlay"><div class="spinner"></div><p class="loader-title">Loading Map Data...</p></div><div id="container" class="flex h-screen w-screen overflow-hidden bg-slate-50"><main id="map-panel" class="relative min-w-0 flex-1 overflow-hidden bg-white"><section id="weather-impact-pane" aria-hidden="true"></section><div id="map-viewport"></div></main><aside id="station-filter" class="relative z-30 flex h-screen w-80 shrink-0 flex-col border-l border-slate-200 bg-white px-5 py-6 text-slate-700 shadow-[-8px_0_24px_rgba(15,23,42,0.08)]"><h2 class="text-xl font-semibold text-slate-800">Stations</h2><input id="station-search" class="mt-5 h-11 w-full rounded-md border border-slate-300 bg-white px-3 text-base font-medium text-slate-700 outline-none transition placeholder:text-slate-400 focus:border-sky-500 focus:ring-2 focus:ring-sky-200" type="search" placeholder="Search..."/><p id="station-count" class="mt-5 border-b border-slate-200 pb-3 text-sm font-medium text-slate-500"></p><div id="station-list" class="min-h-0 flex-1 overflow-y-auto py-3 pr-1"></div><div class="grid grid-cols-2 gap-3 border-t border-slate-200 pt-4"><button id="select-all-stations" class="rounded-md bg-slate-900 px-3 py-2 text-sm font-semibold text-white transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-300" type="button">Select all</button> <button id="clear-stations" class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-sky-300" type="button">Clear</button></div><section id="time-range" class="mt-4 border-t border-slate-200 pt-4"><h3 class="text-base font-semibold text-slate-800">Time range</h3><div class="mt-3 grid grid-cols-2 gap-3"><label class="grid gap-1 text-xs font-semibold text-slate-500">From date <input id="from-date" class="h-9 rounded-md border border-slate-300 bg-white px-2 text-sm font-medium text-slate-700 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-200" type="date"/></label> <label class="grid gap-1 text-xs font-semibold text-slate-500">To date <input id="to-date" class="h-9 rounded-md border border-slate-300 bg-white px-2 text-sm font-medium text-slate-700 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-200" type="date"/></label></div><button id="apply-time-range" class="mt-3 w-full rounded-md bg-slate-900 px-3 py-2 text-sm font-semibold text-white transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-300 cursor-pointer" type="button">Apply</button></section></aside></div></body></html>
