<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Webpack App</title>
    </head>
    <body>
        <div id="container" class="flex h-screen w-screen overflow-hidden bg-slate-50">
            <main id="map-panel" class="relative min-w-0 flex-1 overflow-hidden bg-white"></main>
            <aside
                id="station-filter"
                class="relative z-30 flex h-screen w-80 shrink-0 flex-col border-l border-slate-200 bg-white px-5 py-6 text-slate-700 shadow-[-8px_0_24px_rgba(15,23,42,0.08)]"
            >
                <h2 class="text-xl font-semibold text-slate-800">Stations</h2>
                <input
                    id="station-search"
                    class="mt-5 h-11 w-full rounded-md border border-slate-300 bg-white px-3 text-base font-medium text-slate-700 outline-none transition placeholder:text-slate-400 focus:border-sky-500 focus:ring-2 focus:ring-sky-200"
                    type="search"
                    placeholder="Search..."
                />
                <p
                    id="station-count"
                    class="mt-5 border-b border-slate-200 pb-3 text-sm font-medium text-slate-500"
                ></p>
                <div id="station-list" class="min-h-0 flex-1 overflow-y-auto py-3 pr-1"></div>
                <div class="grid grid-cols-2 gap-3 border-t border-slate-200 pt-4">
                    <button
                        id="select-all-stations"
                        class="rounded-md bg-slate-900 px-3 py-2 text-sm font-semibold text-white transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-300"
                        type="button"
                    >
                        Select all
                    </button>
                    <button
                        id="clear-stations"
                        class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-sky-300"
                        type="button"
                    >
                        Clear
                    </button>
                </div>
                <section id="time-range" class="mt-4 border-t border-slate-200 pt-4">
                    <h3 class="text-base font-semibold text-slate-800">Time range</h3>
                    <div class="mt-3 grid grid-cols-2 gap-3">
                        <label class="grid gap-1 text-xs font-semibold text-slate-500">
                            From date
                            <input
                                id="from-date"
                                class="h-9 rounded-md border border-slate-300 bg-white px-2 text-sm font-medium text-slate-700 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-200"
                                type="date"
                            />
                        </label>
                        <label class="grid gap-1 text-xs font-semibold text-slate-500">
                            To date
                            <input
                                id="to-date"
                                class="h-9 rounded-md border border-slate-300 bg-white px-2 text-sm font-medium text-slate-700 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-200"
                                type="date"
                            />
                        </label>
                    </div>
                    <div
                        id="date-range-picker"
                        class="mt-3 rounded-md border border-slate-200 bg-slate-50 p-3"
                    >
                        <div class="flex items-center justify-between">
                            <button
                                id="previous-month"
                                class="grid h-8 w-8 place-items-center rounded-md border border-slate-300 bg-white text-sm font-bold text-slate-600 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-300"
                                type="button"
                                aria-label="Previous month"
                            >
                                &lt;
                            </button>
                            <p id="calendar-month" class="text-sm font-semibold text-slate-700"></p>
                            <button
                                id="next-month"
                                class="grid h-8 w-8 place-items-center rounded-md border border-slate-300 bg-white text-sm font-bold text-slate-600 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-300"
                                type="button"
                                aria-label="Next month"
                            >
                                &gt;
                            </button>
                        </div>
                        <div class="mt-3 grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400">
                            <span>Mo</span>
                            <span>Tu</span>
                            <span>We</span>
                            <span>Th</span>
                            <span>Fr</span>
                            <span>Sa</span>
                            <span>Su</span>
                        </div>
                        <div id="calendar-days" class="mt-1 grid grid-cols-7 gap-1"></div>
                    </div>
                </section>
            </aside>
        </div>
    </body>
</html>
